<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="logo-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff" /> <!-- Neon Purple -->
      <stop offset="100%" stop-color="#00f3ff" /> <!-- Electric Cyan -->
    </linearGradient>
    <linearGradient id="logo-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" /> <!-- Electric Cyan -->
      <stop offset="100%" stop-color="#e86820" /> <!-- Sunset Orange -->
    </linearGradient>
    
    <!-- Premium glow filter -->
    <filter id="premium-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer sleek tech Hexagon -->
  <polygon 
    points="50,6 88,28 88,72 50,94 12,72 12,28" 
    stroke="url(#logo-grad-1)" 
    stroke-width="2" 
    stroke-opacity="0.3" 
    stroke-dasharray="4 2" 
  />
  <polygon 
    points="50,6 88,28 88,72 50,94 12,72 12,28" 
    stroke="url(#logo-grad-2)" 
    stroke-width="1" 
    stroke-opacity="0.6" 
  />
  
  <!-- Outer glowing node points -->
  <circle cx="50" cy="6" r="2.5" fill="#00f3ff" filter="url(#premium-glow)" />
  <circle cx="88" cy="28" r="2" fill="#863bff" />
  <circle cx="88" cy="72" r="2.5" fill="#e86820" filter="url(#premium-glow)" />
  <circle cx="50" cy="94" r="2" fill="#00f3ff" />
  <circle cx="12" cy="72" r="2.5" fill="#863bff" filter="url(#premium-glow)" />
  <circle cx="12" cy="28" r="2" fill="#e86820" />

  <!-- Inner Stylized Cybernetic "S" Ribbon -->
  <!-- Interlocking glowing path 1 (Top loop of S) -->
  <path 
    d="M 68,36 C 68,24 50,22 42,28 C 32,36 34,46 50,50 C 66,54 68,64 58,72 C 50,78 32,76 32,64" 
    stroke="url(#logo-grad-1)" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#premium-glow)"
  />
  
  <!-- Interlocking glowing path 2 (Center highlight for 3D depth) -->
  <path 
    d="M 42,28 C 32,36 34,46 50,50 C 66,54 68,64 58,72" 
    stroke="url(#logo-grad-2)" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    filter="url(#premium-glow)"
  />
</svg>